name: Build ZMK firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
    with:
      build_matrix: |
        [
          { "board": "nice_nano_v2", "shield": "egs_w1_left" },
          { "board": "nice_nano_v2", "shield": "egs_w1_right" }
        ]