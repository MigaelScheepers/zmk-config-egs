# ==========================================================================
# POWER MANAGEMENT CONFIGURATION
# ==========================================================================
# Enable deep sleep state for maximum battery longevity
CONFIG_ZMK_SLEEP=y

# Milliseconds of inactivity before entering standard idle state (5 minutes)
CONFIG_ZMK_IDLE_TIMEOUT=300000

# Milliseconds of inactivity before entering deep sleep state (15 minutes)
# In deep sleep, the SuperMini cuts power via P0.13 VCC Disconnect automatically
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ==========================================================================
# CONNECTIVITY & BLUETOOTH OPTIMIZATIONS
# ==========================================================================
# Increase radio signal transmission power to eliminate split-half lag or drops
# (Highly recommended for custom builds with cross-hatched ground shielding)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Ensure battery levels for both halves report back to the host system correctly
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_DISPLAY=y

# ==========================================================================
# HARDWARE ENCODER SUPPORT
# ==========================================================================
# Natively enable EC11 rotary encoder scanning loops
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_USB=y
