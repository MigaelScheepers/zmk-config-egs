# ==========================================================================
# SPLIT KEYBOARD
# ==========================================================================
CONFIG_ZMK_SPLIT=y

# ==========================================================================
# USB (allows wired use and flashing confirmation; does not prevent BLE use)
# ==========================================================================
CONFIG_ZMK_USB=y

# ==========================================================================
# POWER MANAGEMENT
# ==========================================================================
CONFIG_ZMK_SLEEP=y

# 5 minutes idle before display/kscan idle state
CONFIG_ZMK_IDLE_TIMEOUT=300000

# 15 minutes idle before deep sleep
# The nice!nano v2 compatible boards cut VCC via P0.13 automatically in deep sleep.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ==========================================================================
# BLUETOOTH
# ==========================================================================
# +8 dBm TX power — helps reliability on custom builds
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ==========================================================================
# BATTERY REPORTING
# ==========================================================================
CONFIG_ZMK_BATTERY_REPORTING=y

# Show right-side (peripheral) battery level on the host as well
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_DISPLAY=y

# ==========================================================================
# ENCODER
# ==========================================================================
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
